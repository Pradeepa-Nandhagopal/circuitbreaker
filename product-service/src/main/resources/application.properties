spring.application.name=product-service

server.port=${PORT:8081}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

management.tracing.enabled=true
management.tracing.sampling.probability=1.0

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
management.health.circuitbreakers.enabled=true

resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.register-health-indicator=true
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventoryCircuitBreaker.wait-duration-in-open-state=10s

resilience4j.bulkhead.instances.recommendationBulkhead.max-concurrent-calls=5
resilience4j.bulkhead.instances.recommendationBulkhead.max-wait-duration=5s

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_inventory_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true